name: flujo ci-cd Kenneth

on: 
    push: 
        branches: 
            - main


env:
    AZURE_FUNCTIONAPP_NAME: func-kenneth-taipe
    RESOURCE_GROUP: rg-alumnos 

jobs:
    build_and_deploy:
        runs-on: self-hosted
        # CI
        steps:
            - name: Hacer Checkout
              uses: actions/checkout@v7

            - name: Configurar dotnet 8
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: '8.0.x'

            - name: Restaurar y publicar
              run: | 
                dotnet restore
                dotnet publish --configuration Release --output ./output

            - name: Hacer zip
              run: |
                cd output
                zip -r ../deploy.zip .
                
            # CD
            - name: Login en Azure (service principal)
              uses: azure/login@v3
              with:
                creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Deploy a producción (Run From Package)
              run: |
                az functionapp deployment source config-zip \
                    --name "$AZURE_FUNCTIONAPP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --src deploy.zip

            - name: Validar que la función responde
              run: |
                 curl --fail --silent --show-error \
                  "https://${AZURE_FUNCTIONAPP_NAME}.azurewebsites.net/api/HelloWorld"

            - name: Mostrar URL de la función
              run: |
                echo "### 🚀 Función desplegada" >> "$GITHUB_STEP_SUMMARY"
                echo "URL: https://${AZURE_FUNCTIONAPP_NAME}.azurewebsites.net/api/HelloWorld" >> "$GITHUB_STEP_SUMMARY"
 