name: flujo ci-cd Kenneth
 
on:
    push:
        branches:
            - main
    workflow_dispatch: {}
 
 
env:
    AZURE_FUNCTIONAPP_NAME: func-kenneth-taipe
    RESOURCE_GROUP: rg-alumnos
 
jobs:
    build_and_deploy:
        runs-on: self-hosted
        # CI
        steps:
            - name: Hacer Checkout
              uses: actions/checkout@v7
 
            - name: Configurar dotnet 8
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: '8.0.x'
 
            - name: Restaurar y publicar
              run: |
                dotnet restore
                dotnet publish --configuration Release --output ./output
 
            - name: Hacer zip
              shell: powershell
              run: |
                Compress-Archive -Path ./output/* -DestinationPath ./deploy.zip -Force
 
            # CD
            - name: Login en Azure (service principal)
              uses: azure/login@v3
              with:
                creds: ${{ secrets.AZURE_CREDENTIALS }}
 
            - name: Deploy a producción (Run From Package)
              shell: powershell
              run: |
                az functionapp deployment source config-zip `
                    --name "$env:AZURE_FUNCTIONAPP_NAME" `
                    --resource-group "$env:RESOURCE_GROUP" `
                    --src deploy.zip

            - name: Sincronizar triggers
              shell: powershell
              run: |
                az resource invoke-action `
                    --action syncfunctiontriggers `
                    --resource-group "$env:RESOURCE_GROUP" `
                    --name "$env:AZURE_FUNCTIONAPP_NAME" `
                    --resource-type Microsoft.Web/sites
                Start-Sleep -Seconds 15

            - name: Validar que la función responde
              shell: powershell
              run: |
                $uri = "https://$($env:AZURE_FUNCTIONAPP_NAME).azurewebsites.net/api/HelloWorld"
                $response = Invoke-WebRequest -Uri $uri -UseBasicParsing
                Write-Host "Respuesta: $($response.StatusCode)"

            - name: Mostrar URL de la función
              shell: powershell
              run: |
                Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### 🚀 Función desplegada"
                Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "URL: https://$($env:AZURE_FUNCTIONAPP_NAME).azurewebsites.net/api/HelloWorld"